windows.wnddialog.elphelt.complete0=.......Ah, ¿es humano? ¡Lo siento! ¡¡¡Lo siento muchísimo!!
windows.wnddialog.elphelt.complete1=...Solo parece un pervertido absurdamente fuerte. Noel, ve y dile algo.
windows.wnddialog.elphelt.complete2=¡Tú también eres de otro mundo, verdad? ¡Si el ""Observador"" que me vio en ese momento está aquí, podemos volver al mundo original! ¡Bien, vamos por la teletransportación!
