windows.wnddialog.star15quest.branch1.0=Espera.. tú eres miembro de Antirain.
windows.wnddialog.star15quest.branch1.1=¿Cómo llegaste a esto?
windows.wnddialog.star15quest.branch1.2=Durante la operación, mientras retrocedíamos por el fracaso de la misión, caí prisionera del Dreamer... \n Bueno, así es como quedé. Un tipo cruel.
windows.wnddialog.star15quest.branch1.3=Entonces, por favor elimina al _StG44_. Si no lo eliminas, podría ser difícil enviar las tropas de refuerzo.
windows.wnddialog.star15quest.branch1.4=Cuidado con el gas paralizante y el líquido altamente ácido que gotea de sus manos. Es mejor pelear en el agua...
windows.wnddialog.star15quest.branch2.0=Espera.. tú eres miembro de Antirain.
windows.wnddialog.star15quest.branch2.1=¿Cómo llegaste a esto?
windows.wnddialog.star15quest.branch2.2=Durante la operación, mientras retrocedíamos por el fracaso de la misión, caí prisionera del Dreamer... \n Bueno, así es como quedé. Un tipo cruel.
windows.wnddialog.star15quest.branch2.3=Entonces, ¿podrías eliminar al _Francotirador de Hierro Sangriento Tipo A_? Si no lo eliminas, podría ser difícil enviar las tropas de refuerzo.
windows.wnddialog.star15quest.branch2.4=Estará intentando emboscarte desde lejos. Nunca te apartes de su alcance.
windows.wnddialog.star15quest.branch3.0=Espera.. tú eres miembro de Antirain.
