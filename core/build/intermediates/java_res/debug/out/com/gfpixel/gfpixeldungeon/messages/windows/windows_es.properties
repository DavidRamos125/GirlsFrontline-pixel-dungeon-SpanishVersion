windows.wnddialog.ppsh47quest.branch1.0=¿Qué haces aquí?
windows.wnddialog.ppsh47quest.branch1.1=¡Ah, hola! Miembros del escuadrón 404, Persica me avisó de que vendrían.
windows.wnddialog.ppsh47quest.branch1.2=¿Qué estás haciendo aquí? Dijeron que eres una mecánica...
windows.wnddialog.ppsh47quest.branch1.3=Persica me envió aquí para recopilar datos. Bueno... una vez que entras, no puedes salir por tu cuenta.
windows.wnddialog.ppsh47quest.branch1.4=Entonces, ¿podrías atrapar 1 _Explorador de Hierro Sangriento_ con este pico? ¡Como agradecimiento mejoraré tus objetos!
windows.wnddialog.ppsh47quest.branch2.0=¿Qué haces aquí?
windows.wnddialog.ppsh47quest.branch2.1=¡Ah, hola! Miembros del escuadrón 404, Persica me avisó de que vendrían.
windows.wnddialog.ppsh47quest.branch2.2=¿Qué estás haciendo aquí? Dijeron que eres una mecánica...
windows.wnddialog.ppsh47quest.branch2.3=Persica me envió aquí para recopilar datos. Bueno... una vez que entras, no puedes salir por tu cuenta.
windows.wnddialog.ppsh47quest.branch2.4=Entonces, ¿podrías traerme 15 _vetas de oro_ con este pico? ¡Como agradecimiento mejoraré tus objetos!
windows.wnddialog.ppsh47quest.complete.branch1.0=¡Vaya, resolvieron el trabajo tan rápido, como era de esperar del escuadrón 404!
windows.wnddialog.ppsh47quest.complete.branch2.0=Oye... ¿no viste mi pico por ahí?
windows.wnddialog.ppsh47quest.inprogress.branch0.0=¡¿He perdido mi pico?! ¡Es el único que tengo!!!
windows.wnddialog.ppsh47quest.inprogress.branch1.0=¡1 _Explorador de Hierro Sangriento_! ¡Será más fácil si lo dejas _a punto de morir_ antes de eliminarlo!
windows.wnddialog.ppsh47quest.inprogress.branch2.0=¡15 _vetas de oro_! ¡La minería consume más turnos, así que ten cuidado!
windows.wnddialog.prison0=Hemos entrado en un lugar extraño, ¿qué se hace aquí?
windows.wnddialog.prison00=UMP9
windows.wnddialog.prison1=Es una prisión. Un lugar donde Hierro Sangriento mantenía a personas como rehenes.
windows.wnddialog.prison11=UMP45
windows.wnddialog.prison2=¿Todavía quedan civiles capturados?
windows.wnddialog.prison22=UMP9
windows.wnddialog.prison3=La mayoría de los civiles están protegidos por el ejército, así que probablemente son de una organización de derechos humanos... ya veo...
windows.wnddialog.prison33=G11
windows.wnddialog.prison4=No los entiendo. ¿Se volvieron locos todos juntos por recibir ácido de colapso?
windows.wnddialog.prison44=HK416
windows.wnddialog.prison5=Hermana, si aquí hay una organización de derechos humanos, no tenemos que quedarnos solo recibiendo órdenes, ¿verdad?
windows.wnddialog.prison55=UMP9
windows.wnddialog.prison6=Si algo interfiere en la operación, mátalo. Esa es nuestra特权, ¿no? Sea humano o muñeca aliada.
windows.wnddialog.prison66=UMP45
windows.wnddialog.rabbit0=...Extraño...
windows.wnddialog.rabbit00=UMP9
windows.wnddialog.rabbit1=9, ¿hay algún problema?
windows.wnddialog.rabbit11=UMP45
windows.wnddialog.rabbit2=La conexión de comunicaciones con el mando es inestable. Parece que hay 2 señales de interferencia cerca, pero son diferentes a las que usa Hierro Sangriento.
windows.wnddialog.rabbit22=UMP9
windows.wnddialog.rabbit3=Tengo la sensación de que algo muy molesto está a punto de empezar...
windows.wnddialog.rabbit33=G11
windows.wnddialog.rabbit4=Voy a salir un momento fuera del rango de la señal. El amigo del mando podría saber algo.
windows.wnddialog.rabbit44=UMP9
windows.wnddialog.rabbit5=No estoy seguro de que el Arquitecto diga algo útil.
windows.wnddialog.rabbit55=HK416
windows.wnddialog.rabbit6=¡Ya volví! El Arquitecto dice que esta no es una señal de Hierro Sangriento. La señorita Helian también dice que es la primera vez que la ve... y nos pide que vayamos a investigar la señal.
windows.wnddialog.rabbit66=UMP9
windows.wnddialog.rabbit7=¿Mencionaste la bonificación extra?
windows.wnddialog.rabbit77=UMP45
windows.wnddialog.rabbit8=Por supuesto, nos darán un 30% adicional de nuestra recompensa original. Dijo que como es una misión de reconocimiento, eso sería suficiente.
windows.wnddialog.rabbit88=UMP9
windows.wnddialog.rabbit9=No está mal~ ¡Vamos!
windows.wnddialog.rabbit99=UMP45
windows.wnddialog.recaves0=¡¡Dreamer!! ¡¡¡Dreamer!!!
windows.wnddialog.recaves00=DESTROYER
windows.wnddialog.recaves1=¿Por qué haces tanto ruido?
windows.wnddialog.recaves11=DREAMER
windows.wnddialog.recaves2=¡¡Los de Grifon!! ¡Los de Grifon están rompiendo la línea defensiva y vienen para aquí!!
windows.wnddialog.recaves22=DESTROYER
windows.wnddialog.recaves3=¿Finalmente llegaron los desechos de Grifon? ¡Pensé que me moría de espera~!
windows.wnddialog.recaves33=DREAMER
windows.wnddialog.recaves4=Entonces, ¿""eso"" que estás creando ya está terminado? ¡Oye, ¿me estás escuchando!?
windows.wnddialog.recaves44=DESTROYER
windows.wnddialog.recaves5=Bien, te daré un nuevo cuerpo. Yo también he estado pensando en algo últimamente...
windows.wnddialog.recaves55=DREAMER
windows.wnddialog.recaves6=¿Quieres más potencia de fuego? ¿O prefieres ser más ágil? ¿O tal vez... pelear con más estilo?
windows.wnddialog.recaves66=DREAMER
windows.wnddialog.recaves7=¿¿De verdad?? ¿¿En serio?? ¡Mientras sea bonito, no hay ningún problema!
windows.wnddialog.recaves77=DESTROYER
windows.wnddialog.recaves8=El Destructor... sigue siendo igual de débil...
windows.wnddialog.recaves88=G11
windows.wnddialog.recaves9=No bajes la guardia. Todos reorganicen cargadores, equipo y armas. Desde aquí en adelante no sabemos qué nos espera.
windows.wnddialog.recaves99=UMP45
