windows.wnddialog.m16a1quest.branch1.0=¿Quién es esta persona? ¡Se ve impresionante!
windows.wnddialog.m16a1quest.branch1.1=...Cállate, da igual. Hazme un favor.\n Hay un objeto que necesito llevarme de aquí antes de volver.
windows.wnddialog.m16a1quest.branch1.2=Lo que necesito es la _Señal de Persica_.\n Está infectada con un virus, así que si la encuentras, vuelve conmigo lo más rápido posible.
windows.wnddialog.m16a1quest.branch1.3=Podría eliminarte ahora mismo. No me des órdenes a la ligera.
windows.wnddialog.m16a1quest.branch1.4=Bueno, es un favor del hermano mayor de Antirain, así que ¿por qué no? \n Está bien. Solo tengo que traer la Señal de Persica, ¿verdad?
windows.wnddialog.m16a1quest.branch2.0=¿Quién es esta persona? ¡Se ve impresionante!
windows.wnddialog.m16a1quest.branch2.1=...Cállate, da igual. Hazme un favor.\n Hay un objeto que necesito llevarme de aquí antes de volver.
windows.wnddialog.m16a1quest.branch2.2=Lo que necesito es el _Motor Ardiente_.\n Consigue una batería, ve al teleportador y actívalo.
windows.wnddialog.m16a1quest.branch2.3=Podría eliminarte ahora mismo. No me des órdenes a la ligera.
windows.wnddialog.m16a1quest.branch2.4=Bueno, es un favor del hermano mayor de Antirain, así que ¿por qué no? \n Está bien. Solo tengo que traer el Motor Ardiente, ¿verdad?
