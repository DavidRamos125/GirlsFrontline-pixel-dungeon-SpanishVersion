windows.wnddialog.noelquest.branch0.0=....Sí, después de que caí en la ""caldera""...
windows.wnddialog.noelquest.branch0.1=Hermana, una de esas señales de las que hablaste antes parece ser de esta chica. Oye, ¿quién eres?
windows.wnddialog.noelquest.branch0.2=¿Y... y? ¿A mí? ¡Me llamo Noel Vermillion! Pero, ¿y ustedes? Y, ¿dónde estamos? ¿Podrían decirme... qué año es?
windows.wnddialog.noelquest.branch0.3=2062, no puedo decirte a qué pertenecemos. Esta es la zona de operaciones S118, ¿qué haces en un lugar tan peligroso?
windows.wnddialog.noelquest.branch0.4=¿Q-qué?! ¿¿Entonces he venido 100 años al pasado?? ¡¿Han visto a un tipo con orejas de conejo largo? ¡Si lo encuentro puedo volver a mi mundo original!
windows.wnddialog.noelquest.branch0.5=Estamos detectando otra señal extraña además de la tuya, podría ser él. Perfecto. Ahora mismo necesitamos identificar esa señal, ¿colaborarás?
windows.wnddialog.noelquest.branch0.6=Entendido. Pero de repente, ¿podrían conseguir 4 baterías e instalarlas en el teleportador en el que vine?
windows.wnddialog.noelquest.branch0.7=Ah, y si algo aparece del teleportador, ¡captúralo y tráeme el botín!
windows.wnddialog.noelquest.complete0=¿Qué tal? ¿El teleportador funciona bien?\n\n.....¡Guau! ¡Como esperaba, había un tipo extraño cerca del teleportador! Debería habértelo dado antes, ¡pero aún no es tarde, por favor acéptalo!
windows.wnddialog.noelquest.inprogress.branch0.0=Reúne 4 _baterías de teleportador_ y ve al teleportador. ¡Seguro están en este piso!
windows.wnddialog.p7quest.branch1.0=¿Qué haces aquí, escuadrón 404?
windows.wnddialog.p7quest.branch1.1=Estamos en una operación. Lo siento, pero no puedo decirte los detalles.
windows.wnddialog.p7quest.branch1.2=Hmm, ya veo. Oye, ¿puedes hacerme un favor?
windows.wnddialog.p7quest.branch1.3=Estoy pensando en abrir un servicio de suministros de pago aquí.\n\nPero algunos de Hierro Sangriento dificultan el suministro...
windows.wnddialog.p7quest.branch1.4=Así que, ¿podrías atrapar 8 ametralleros y traerme sus insignias como prueba? ¡Te recompensaré mejorando tus objetos!
windows.wnddialog.p7quest.branch2.0=¿Qué haces aquí, escuadrón 404?
windows.wnddialog.p7quest.branch2.1=Estamos en una operación. Lo siento, pero no puedo decirte los detalles.
windows.wnddialog.p7quest.branch2.2=Hmm, ya veo. Oye, ¿puedes hacerme un favor?
windows.wnddialog.p7quest.branch2.3=Estoy pensando en abrir un servicio de suministros de pago aquí.\n\nPero algunos de Hierro Sangriento dificultan el suministro...
windows.wnddialog.p7quest.branch2.4=Así que, ¿podrías atrapar 4 Manticores y traerme sus insignias como prueba? ¡Te recompensaré mejorando tus objetos!
windows.wnddialog.p7quest.complete0=¡Vaya! ¡De verdad lo lograron!\n\nEn realidad pensaba que no podrían. Como disculpa y agradecimiento, ¡toma esta mira de puntos!
windows.wnddialog.p7quest.inprogress.branch1.0=¡Todavía no muertos! ¡Qué alivio~!\n\nA veces rechazan el ataque, así que ten más cuidado.
windows.wnddialog.p7quest.inprogress.branch2.0=¡Todavía no muertos! ¡Qué alivio~!\n\nReciben poco daño de los ataques muy fuertes, así que necesitarás paciencia para atacar.
