windows.wnddialog.star15quest.branch3.3=Entonces, ¿podrías eliminar al _Aegis_? Si no lo eliminas, podría ser difícil enviar las tropas de refuerzo.
windows.wnddialog.star15quest.branch3.4=El tipo bloquea todos los ataques si no le haces un golpe sorpresa, así que tendrás que atacar fuera de su campo de visión.
windows.wnddialog.star15quest.complete0=Gracias, ahora que ese tipo ha desaparecido, será más fácil enviar las tropas de refuerzo. Toma, elige una de estas.
