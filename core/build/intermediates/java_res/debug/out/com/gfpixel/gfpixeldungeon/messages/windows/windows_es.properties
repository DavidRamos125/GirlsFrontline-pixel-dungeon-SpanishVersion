windows.wnddialog.m16a1quest.branch3.1=...Cállate, da igual. Hazme un favor.\n Hay un objeto que necesito llevarme de aquí antes de volver.
windows.wnddialog.m16a1quest.branch3.2=Lo que necesito es la _Fruta Podrida_.\n Es una planta que Hierro Sangriento plantó aquí, necesito una muestra. Nunca uses fuego.
windows.wnddialog.m16a1quest.branch3.3=Podría eliminarte ahora mismo. No me des órdenes a la ligera.
